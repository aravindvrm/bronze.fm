name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      # `npm run build` ends with scripts/check-dist.mjs, which fails if audio,
      # secret-shaped files, or oversized assets reached dist/. This repo once
      # shipped 66 MB of unreleased masters into the build output because
      # public/ is copied wholesale — this is what stops that recurring.
      - name: Build and verify dist
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The masters are gitignored, so CI has no audio. Generate silent stand-ins
      # at the same paths the fixtures reference, so playback, seeking and Range
      # handling are all exercised against real media without shipping the album.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Synthesise stand-in audio
        run: node scripts/gen-test-audio.mjs

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration from scratch against a throwaway instance, so a
      # migration that no longer applies cleanly fails here rather than on a
      # developer's manual `db push`.
      - name: Start local Supabase
        run: supabase start

      - name: Assert RLS against the local instance
        run: |
          set -euo pipefail

          # Key names differ across CLI versions (ANON_KEY vs PUBLISHABLE_KEY),
          # so source the whole env rather than grepping for one name. Print the
          # names — never the values — to make a future rename obvious.
          echo "keys exposed: $(supabase status -o env | cut -d= -f1 | tr '\n' ' ')"
          eval "$(supabase status -o env)"

          export SUPABASE_URL="${API_URL:-}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"

          # Fail loudly here: an empty key makes every request 401, which reads
          # like a broken RLS policy rather than a broken lookup.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Could not read API_URL / anon key from supabase status"
            exit 1
          fi

          npx vitest run tests/rls.test.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The repo is public and the app handles Supabase keys. The anon key is
      # meant to ship; a service-role key never is.
      - name: Scan tracked files for secrets
        run: |
          set -euo pipefail
          fail=0
          # -e is required: a pattern starting with "-----" would otherwise be
          # parsed as flags by git grep.
          scan() {
            if git grep -nIE -e "$1" -- . ':!*.md' ':!.github/workflows/*' > /tmp/hits 2>/dev/null; then
              echo "::error::$2"
              cat /tmp/hits
              fail=1
            fi
          }
          scan 'sb_secret_[A-Za-z0-9_-]{8,}' 'Supabase secret key committed'
          scan '"role"[[:space:]]*:[[:space:]]*"service_role"' 'Decoded service_role JWT committed'
          scan 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9]' 'service-role key has a value in a tracked file'
          scan '-----BEGIN [A-Z ]*PRIVATE KEY-----' 'Private key committed'
          exit $fail

      - name: Ensure no audio is tracked in git
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(mp3|m4a|aac|ogg|opus|wav|flac|aiff?)$'; then
            echo "::error::Audio files are tracked in git. Masters must stay gitignored."
            exit 1
          fi
          echo "No audio tracked."
